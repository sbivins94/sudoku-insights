name: CI/CD - Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: "5.9"

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

      - name: Build for iOS
        run: |
          swift build \
            -c release \
            --destination 'generic/platform=iOS' \
            --build-tests
